[project]
name = "showup-backend"
version = "0.1.0"
description = "ShowUp API: drop-in sports games with a show-up reputation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
