services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: showup
      POSTGRES_PASSWORD: showup
      POSTGRES_DB: showup
    ports:
      # Host port is POSTGRES_PORT from a root .env (default 5432) in case 5432 is taken.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showup -d showup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
