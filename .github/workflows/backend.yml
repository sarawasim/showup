name: backend

# Runs on every pull request and on every push to main.
# No path filter on purpose: if this check is ever made "required" in branch
# protection, a filtered workflow would never report on frontend-only pull
# requests and would block them forever. The whole job takes about a minute.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, migrate, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, same major version as the hosted Supabase database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: showup
          POSTGRES_PASSWORD: showup
          POSTGRES_DB: showup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U showup -d showup_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # CI-only values. Nothing here is a real secret.
    env:
      DATABASE_URL: postgresql+psycopg://showup:showup@localhost:5432/showup_test
      TEST_DATABASE_URL: postgresql+psycopg://showup:showup@localhost:5432/showup_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-chars

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes exact version tags only, there is no floating v10.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Applies every migration to an empty database, the way a new teammate would.
      - name: Apply migrations
        run: uv run alembic upgrade head

      # Fails if a model changed without a matching migration.
      - name: Check models match migrations
        run: uv run alembic check

      - name: Test
        run: uv run pytest
